<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drop Box — by nemath</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --bg: #0D0C0B;
    --panel: #141312;
    --ink: #F3EFE6;
    --muted: #8A8480;
    --gold: #C9A24B;
    --line: #2B2926;
    --error: #C96659;
    --radius: 4px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .console {
    width: 100%;
    max-width: 420px;
  }

  .mark {
    margin-bottom: 30px;
    text-align: center;
  }

  .mark h1 {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: 46px;
    margin: 0;
    color: var(--ink);
    line-height: 1;
    letter-spacing: -0.01em;
  }

  .mark .credit {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 14px;
    color: var(--gold);
    margin-top: 8px;
  }

  .mark .headline {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 17px;
    color: var(--ink);
    margin: 16px 0 0;
  }

  .mark .tagline {
    margin-top: 8px;
    color: var(--muted);
    font-size: 12.5px;
    letter-spacing: 0.02em;
  }

  .rule {
    height: 1px;
    background: var(--line);
    margin: 24px 0;
    border: none;
  }

  .tabs {
    display: flex;
    gap: 28px;
    margin-bottom: 22px;
    justify-content: center;
  }

  .tab {
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    letter-spacing: 0.03em;
    padding: 0 0 8px;
    cursor: pointer;
    border-bottom: 1px solid transparent;
    transition: color 0.2s ease, border-color 0.2s ease;
  }

  .tab.active {
    color: var(--ink);
    border-bottom-color: var(--gold);
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 28px;
  }

  .hidden { display: none !important; }

  .drop {
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    padding: 36px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease;
  }

  .drop:hover, .drop.dragover {
    border-color: var(--gold);
    background: rgba(201, 162, 75, 0.04);
  }

  .drop p {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
  }

  .drop strong {
    color: var(--ink);
    font-weight: 500;
  }

  input[type="file"] { display: none; }

  .filelist {
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .fileitem {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    padding: 9px 2px;
    border-bottom: 1px solid var(--line);
  }

  .fileitem span:first-child {
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-right: 12px;
  }

  button.primary {
    width: 100%;
    margin-top: 20px;
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--ink);
    border-radius: var(--radius);
    padding: 13px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }

  button.primary:hover:not(:disabled) {
    background: var(--ink);
    color: var(--bg);
  }

  button.primary:disabled { opacity: 0.3; cursor: not-allowed; }

  .result {
    margin-top: 26px;
    text-align: center;
  }

  .code {
    font-family: 'Fraunces', serif;
    font-size: 40px;
    font-weight: 400;
    letter-spacing: 8px;
    color: var(--gold);
    padding: 6px 0 12px;
  }

  .result p {
    color: var(--muted);
    font-size: 12.5px;
    margin: 4px 0 0;
  }

  .countdown {
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  .qr-wrap {
    display: flex;
    justify-content: center;
    margin: 18px 0 10px;
  }

  .qr-wrap img, .qr-wrap canvas {
    background: var(--ink);
    padding: 12px;
    border-radius: var(--radius);
  }

  .field { display: flex; }

  input[type="text"] {
    flex: 1;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--ink);
    font-family: 'Fraunces', serif;
    font-size: 22px;
    letter-spacing: 5px;
    text-align: center;
    padding: 14px;
    text-transform: uppercase;
  }

  input[type="text"]::placeholder {
    color: var(--muted);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    letter-spacing: 0.05em;
  }

  input[type="text"]:focus {
    outline: none;
    border-color: var(--gold);
  }

  .status {
    margin-top: 16px;
    font-size: 12.5px;
    color: var(--muted);
    min-height: 18px;
    text-align: center;
  }

  .status.error { color: var(--error); }

  .downloads {
    margin-top: 18px;
    display: flex;
    flex-direction: column;
  }

  .downloads a {
    display: block;
    color: var(--ink);
    text-decoration: none;
    font-size: 13px;
    padding: 12px 2px;
    border-bottom: 1px solid var(--line);
    transition: color 0.15s ease;
  }

  .downloads a:hover { color: var(--gold); }

  .foot {
    margin-top: 26px;
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>

<div class="console">
  <div class="mark">
    <h1>Drop Box</h1>
    <div class="credit">by nemath</div>
    <p class="headline">just keep it simple</p>
    <p class="tagline">between screens</p>
  </div>

  <hr class="rule">

  <div class="tabs">
    <button class="tab active" data-tab="send">Send</button>
    <button class="tab" data-tab="receive">Receive</button>
  </div>

  <!-- SEND PANEL -->
  <div class="panel" id="send-panel">
    <div class="drop" id="drop">
      <p><strong>Choose photographs</strong><br>or drag them here</p>
    </div>
    <input type="file" id="file-input" accept="image/*" multiple>
    <div class="filelist" id="filelist"></div>
    <button class="primary" id="upload-btn" disabled>SEND</button>
    <div class="status" id="send-status"></div>

    <div class="result hidden" id="send-result">
      <div class="code" id="share-code">------</div>
      <p>Share this code, or scan below</p>
      <div class="qr-wrap" id="qr-wrap"></div>
      <p>Expires in <span class="countdown" id="countdown">20:00</span></p>
    </div>
  </div>

  <!-- RECEIVE PANEL -->
  <div class="panel hidden" id="receive-panel">
    <div class="field">
      <input type="text" id="code-input" placeholder="enter code">
    </div>
    <button class="primary" id="fetch-btn">FIND</button>
    <div class="status" id="receive-status"></div>
    <div class="downloads" id="downloads"></div>
  </div>

  <div class="foot">Files are removed automatically after 20 minutes.</div>
</div>

<script>
  const API = ''; // same origin

  // ---- Tab switching ----
  const tabs = document.querySelectorAll('.tab');
  const sendPanel = document.getElementById('send-panel');
  const receivePanel = document.getElementById('receive-panel');
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      if (tab.dataset.tab === 'send') {
        sendPanel.classList.remove('hidden');
        receivePanel.classList.add('hidden');
      } else {
        receivePanel.classList.remove('hidden');
        sendPanel.classList.add('hidden');
      }
    });
  });

  // ---- Send flow ----
  const drop = document.getElementById('drop');
  const fileInput = document.getElementById('file-input');
  const filelistEl = document.getElementById('filelist');
  const uploadBtn = document.getElementById('upload-btn');
  const sendStatus = document.getElementById('send-status');
  const sendResult = document.getElementById('send-result');
  const shareCodeEl = document.getElementById('share-code');
  const countdownEl = document.getElementById('countdown');

  let selectedFiles = [];

  drop.addEventListener('click', () => fileInput.click());
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('dragover'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('dragover'));
  drop.addEventListener('drop', e => {
    e.preventDefault();
    drop.classList.remove('dragover');
    handleFiles(e.dataTransfer.files);
  });
  fileInput.addEventListener('change', () => handleFiles(fileInput.files));

  function handleFiles(fileListRaw) {
    selectedFiles = Array.from(fileListRaw).filter(f => f.type.startsWith('image/'));
    filelistEl.innerHTML = '';
    selectedFiles.forEach(f => {
      const row = document.createElement('div');
      row.className = 'fileitem';
      row.innerHTML = `<span>${f.name}</span><span>${(f.size / 1024).toFixed(0)} KB</span>`;
      filelistEl.appendChild(row);
    });
    uploadBtn.disabled = selectedFiles.length === 0;
  }

  uploadBtn.addEventListener('click', async () => {
    if (selectedFiles.length === 0) return;
    uploadBtn.disabled = true;
    sendStatus.textContent = 'Uploading...';
    sendStatus.className = 'status';

    const formData = new FormData();
    selectedFiles.forEach(f => formData.append('photos', f));

    try {
      const res = await fetch(`${API}/upload`, { method: 'POST', body: formData });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Upload failed');

      sendStatus.textContent = '';
      shareCodeEl.textContent = data.code;
      sendResult.classList.remove('hidden');
      startCountdown(data.expiresAt);

      const qrWrap = document.getElementById('qr-wrap');
      qrWrap.innerHTML = '';
      const receiveUrl = `${window.location.origin}${window.location.pathname}?code=${data.code}`;
      new QRCode(qrWrap, {
        text: receiveUrl,
        width: 140,
        height: 140,
        colorDark: '#0D0C0B',
        colorLight: '#F3EFE6'
      });
    } catch (err) {
      sendStatus.textContent = err.message;
      sendStatus.className = 'status error';
      uploadBtn.disabled = false;
    }
  });

  function startCountdown(expiresAt) {
    const tick = () => {
      const remaining = Math.max(0, expiresAt - Date.now());
      const mins = Math.floor(remaining / 60000);
      const secs = Math.floor((remaining % 60000) / 1000);
      countdownEl.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
      if (remaining <= 0) {
        clearInterval(interval);
        countdownEl.textContent = 'expired';
      }
    };
    tick();
    const interval = setInterval(tick, 1000);
  }

  // ---- Receive flow ----
  const codeInput = document.getElementById('code-input');
  const fetchBtn = document.getElementById('fetch-btn');
  const receiveStatus = document.getElementById('receive-status');
  const downloadsEl = document.getElementById('downloads');

  fetchBtn.addEventListener('click', async () => {
    const code = codeInput.value.trim().toUpperCase();
    if (code.length !== 6) {
      receiveStatus.textContent = 'Enter the 6-character code';
      receiveStatus.className = 'status error';
      return;
    }

    receiveStatus.textContent = 'Looking up code...';
    receiveStatus.className = 'status';
    downloadsEl.innerHTML = '';

    try {
      const res = await fetch(`${API}/info/${code}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Code not found');

      receiveStatus.textContent = `${data.count} photo${data.count > 1 ? 's' : ''} found`;
      data.names.forEach((name, i) => {
        const link = document.createElement('a');
        link.href = `${API}/download/${code}/${i}`;
        link.textContent = `Download: ${name}`;
        downloadsEl.appendChild(link);
      });
    } catch (err) {
      receiveStatus.textContent = err.message;
      receiveStatus.className = 'status error';
    }
  });

  codeInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') fetchBtn.click();
  });

  // ---- Auto-fill from QR scan (?code=ABC123 in the URL) ----
  const urlParams = new URLSearchParams(window.location.search);
  const incomingCode = urlParams.get('code');
  if (incomingCode) {
    tabs.forEach(t => t.classList.remove('active'));
    document.querySelector('.tab[data-tab="receive"]').classList.add('active');
    sendPanel.classList.add('hidden');
    receivePanel.classList.remove('hidden');

    codeInput.value = incomingCode.toUpperCase();
    fetchBtn.click();
  }
</script>

</body>
</html>
